{% extends 'blog/base.html' %} {% block title %} Create Blog | Blog Platform {% endblock %} {% block content %}

<div class="form-container">

    <h2>Create New Blog</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="title">
                Blog Title
            </label>

            <input type="text" id="title" name="title" placeholder="Enter blog title" required>

        </div>


        <div class="form-group">

            <label for="category">
                Category
            </label>

            <select id="category" name="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Technology">
                    Technology
                </option>

                <option value="Programming">
                    Programming
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Lifestyle">
                    Lifestyle
                </option>

                <option value="Travel">
                    Travel
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="image">
                Image URL
            </label>

            <input type="url" id="image" name="image" placeholder="https://example.com/image.jpg">

        </div>


        <div class="form-group">

            <label for="content">
                Blog Content
            </label>

            <textarea id="content" name="content" rows="10" placeholder="Write your blog here..." required></textarea>

        </div>


        <button type="submit" class="form-btn">
            Publish Blog
        </button>

    </form>


    <p style="text-align:center; margin-top:20px;">

        <a href="{% url 'home' %}" style="color:#2563eb; font-weight:bold;">
            ← Back to Home
        </a>

    </p>

</div>

{% endblock %}
